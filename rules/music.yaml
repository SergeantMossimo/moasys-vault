# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Music rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
# Edit a value to change the project-wide default. Comment a line out to fall
# back to the code default. Library-specific overrides belong in
# `rules/music.local.yaml`, which is gitignored.
#
# Full reference: docs/CONFIG.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Folder + track name patterns ────────────────────────────────────────────
# Plex doesn't enforce artist or album folder naming — defaults match anything
# non-empty. Tighten them in music.local.yaml if you use a stricter scheme.
# Track patterns: scanner tries multi_disc first, then falls back to single_disc.
patterns:
  artist_folder: '^(?<name>.+)$'                                 # Permissive default
  album_folder:  '^(?<name>.+)$'                                 # Permissive default
  single_disc:   '^(?<track>\d{2})\s-\s(?<name>.+)$'             # 01 - Track Name
  multi_disc:    '^(?<disc>\d+)(?<track>\d{2})\s-\s(?<name>.+)$' # 101 - Track Name (disc 1, track 1)

# ── Subfolders under root_path to walk ──────────────────────────────────────
# Empty (the default) = scan root_path directly and label everything as
# "default". Configure for your library in music.local.yaml.
#
# Common use cases:
#
#   # A. Organized by general tags / source:
#   categories:
#     - { name: Music }
#     - { name: Soundtracks }
#     - { name: Live }
#
#   # B. Flat library (no subfolders):
#   categories: []
#
# Note: music doesn't use quality-organized categories — there's no per-album
# quality dimension check today. See docs/CONFIG.md for details.
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
# Primary = formats you prefer (others fire warn_non_primary).
primary_extension:
  - .flac
  - .mp3
  - .m4a

# Audio = every extension recognized as a music file.
audio_extensions:
  - .flac
  - .mp3
  - .aac
  - .m4a
  - .wav
  - .ogg
  - .wma

# Sidecar = silently allowed alongside tracks (cover art, lyrics, cuesheets).
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .lrc
  - .cue
  - .m3u
  - .m3u8
  - .pdf

# ── Acceptable codec combos ─────────────────────────────────────────────────
# Codec mixes that are intentional and should NOT fire warn_quality_inconsistent.
# Quality sets — order doesn't matter. Codec names match the upper-case form
# used in audio_quality_summary (FLAC, MP3, AAC, ALAC, OGG, WAV, etc.).
#
# Only applies to codec-mix cases. Bitrate-spread cases within a single codec
# (e.g. MP3 192 + MP3 320) still fire the warning even when [MP3] is listed
# here. For that, fix the encoding or list the album in ignored/<drive>/music.yaml.
#
# Empty default = every codec mix is flagged.
acceptable_codec_combos: []

# ── Acceptable cross-category album combos ──────────────────────────────────
# Category sets where the same album may legitimately appear without firing
# warn_duplicate_album. Set-based comparison — order doesn't matter.
#
# Example: a soundtrack kept in both `Music` and `Soundtracks` is whitelisted
# with `- [Music, Soundtracks]`.
#
# Empty default = every cross-category duplicate is flagged.
acceptable_album_combos: []

# ── Per-warning toggles ─────────────────────────────────────────────────────
# Set any to false to silence that warning everywhere. To silence on specific
# items only, use ignored/<drive>/music.yaml instead.
checks:
  warn_non_primary: true              # File isn't the configured primary format
  warn_no_audio: true                 # Album folder has no audio files
  warn_bad_track_name: true           # Track file name doesn't match any pattern
  warn_bad_artist_folder: true        # Artist folder doesn't match patterns.artist_folder
  warn_bad_album_folder: true         # Album folder doesn't match patterns.album_folder
  warn_suspicious_folder_chars: true  # Trailing whitespace / Windows-illegal / reserved names
  warn_track_gaps: true               # Gap detected in track numbers (per-disc)
  warn_duplicate_album: true          # Same artist + album in more than one media folder
  warn_loose_files: true              # Audio files at unexpected nesting
  warn_extra_subfolders: true         # Unexpected subfolders inside an album folder
  warn_unexpected_entries: true       # Non-audio, non-sidecar files
  warn_quality_inconsistent: true     # Album mixes codecs or has a wide bitrate spread
  warn_compilation_detected: true     # Multiple distinct AlbumArtists in one album
  warn_folder_tag_mismatch: true      # Folder name disagrees with the embedded tag
  warn_folder_tag_case: true          # Folder matches the embedded tag except for capitalization
  warn_missing_tags: true             # Required embedded tag fields are blank
  warn_track_number_mismatch: true    # Filename track number disagrees with the embedded tag
  warn_mono_audio: true               # Album has tracks encoded as mono (single channel)
