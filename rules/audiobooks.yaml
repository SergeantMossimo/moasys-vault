# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Audiobooks rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
# Edit a value to change the project-wide default. Comment a line out to fall
# back to the code default. Library-specific overrides belong in
# `rules/audiobooks.local.yaml`, which is gitignored.
#
# Full reference: docs/CONFIG.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Chapter file patterns ───────────────────────────────────────────────────
# Scanner tries multi_disc first, then falls back to single_disc.
patterns:
  single_disc: '^(?<chapter>\d{2})\s-\s(?<name>.+)$'             # 01 - Chapter Name
  multi_disc:  '^(?<disc>\d+)(?<chapter>\d{2})\s-\s(?<name>.+)$' # 101 - Chapter Name (disc 1, chapter 1)

# ── Subfolders under root_path to walk ──────────────────────────────────────
# Empty (the default) = scan root_path directly and label everything as
# "default". Configure for your library in audiobooks.local.yaml.
#
# Common use cases:
#
#   # A. Organized by source / format:
#   categories:
#     - { name: Audible }
#     - { name: Book On CD }
#
#   # B. Flat library (no subfolders):
#   categories: []
#
# Note: audiobooks don't use quality-organized categories — spoken word at
# modest bitrates is fine, so no quality dimension check applies.
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
# Primary = formats you prefer (others fire warn_non_primary).
primary_extension:
  - .mp3
  - .flac

# Audio = every extension recognized as an audiobook chapter.
audio_extensions:
  - .m4b
  - .mp3
  - .aac
  - .m4a
  - .flac

# Sidecar = silently allowed alongside chapters (cover art, cuesheets, PDFs).
sidecar_extensions:
  - .nfo
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .cue
  - .pdf

# ── Acceptable cross-category book combos ───────────────────────────────────
# Category sets where the same book may legitimately appear without firing
# warn_duplicate_book. Set-based comparison — order doesn't matter.
#
# Example: a book kept in both `Audible` and `Book On CD` is whitelisted
# with `- [Audible, Book On CD]`.
#
# Empty default = every cross-category duplicate is flagged.
acceptable_book_combos: []

# ── Per-warning toggles ─────────────────────────────────────────────────────
# Set any to false to silence that warning everywhere. To silence on specific
# items only, use ignored/<drive>/audiobooks.yaml instead.
checks:
  warn_non_primary: true        # File isn't the configured primary format
  warn_no_audio: true           # Book folder has no audio files
  warn_bad_chapter_name: true   # Chapter file name doesn't match any pattern
  warn_chapter_gaps: true       # Gap detected in chapter numbers (per-disc)
  warn_duplicate_book: true     # Same book title in more than one media folder
  warn_loose_files: true        # Audio files at unexpected nesting
  warn_extra_subfolders: true   # Unexpected subfolders inside a book folder
  warn_unexpected_entries: true # Non-audio, non-sidecar files
  # Name consistency — compares books against each other, recommends the majority spelling
  warn_series_name_mismatch: true # Same series spelled differently (Gaunt's Ghost / Gaunt's Ghosts)
  warn_series_name_case: true     # Series or title prefix capitalized differently (HALO / Halo)
  warn_author_name_mismatch: true # Same author spelled differently (Tobias S. Buckell / Tobias Buckell)
  warn_author_name_case: true     # Author capitalized differently
  warn_encoded_characters: true   # HTML entities like &quot; in a folder name
  warn_mixed_punctuation: true    # Curly vs straight quotes against the library majority
  # Embedded tags — compares album/artist tags to the book/author folders
  warn_book_tag_mismatch: true    # Album tag names a different book than the folder
  warn_book_tag_case: true        # Album tag and folder differ only in capitalization
  warn_author_tag_mismatch: true  # Artist tag names different authors than the folder
  warn_author_tag_case: true      # Artist tag and folder differ only in capitalization
  warn_missing_book_tags: true    # No chapter has an album or artist tag
  # Open Library — only run by `npm run validate:audiobooks`
  warn_openlibrary_not_found: false       # No match at all (off: patchy coverage of tie-in fiction)
  warn_openlibrary_title_mismatch: true   # Title is a typo's distance from a same-author book
  warn_openlibrary_title_case: false      # Capitalization only (off: Open Library capitalizes inconsistently)
  warn_openlibrary_author_mismatch: true  # Title matches but none of the authors do
