# ─────────────────────────────────────────────────────────────────────────────
# MOASYS-Vault — Movies rules (defaults)
# ─────────────────────────────────────────────────────────────────────────────
# Edit a value to change the project-wide default. Comment a line out to fall
# back to the code default. Library-specific overrides (your own categories,
# custom quality thresholds, etc.) belong in `rules/movies.local.yaml`, which
# is gitignored.
#
# Full reference: docs/CONFIG.md
# ─────────────────────────────────────────────────────────────────────────────

# ── Folder + file name patterns ─────────────────────────────────────────────
# Plex's movie naming convention. Patterns use named capture groups.
patterns:
  folder: '^(?<title>.+)\s\((?<year>\d{4})\)$'                                     # The Crow (1994)
  file:   '^(?<title>.+)\s\((?<year>\d{4})\)(?:\s\{edition-(?<edition>[^}]*)\})?$' # The Crow (1994) {edition-Director's Cut}

# ── Subfolders under root_path to walk ──────────────────────────────────────
# Empty (the default) = scan root_path directly and label everything as
# "default". Configure for your library in movies.local.yaml.
#
# Common use cases:
#
#   # A. Organized by quality (UHD/HD/SD auto-detected):
#   categories:
#     - { name: UHD }
#     - { name: HD }
#     - { name: SD }
#     - { name: Other UHD }
#     - { name: Other HD }
#
#   # B. Organized by general tags (no quality concept):
#   categories:
#     - { name: Movies }
#     - { name: Documentaries }
#     - { name: Kids }
#
#   # C. Flat library (no subfolders):
#   categories: []
#
# See docs/CONFIG.md "Three configuration shapes" for the full explanation.
categories: []

# ── File extensions ─────────────────────────────────────────────────────────
# Primary = formats you prefer (others fire warn_non_primary).
primary_extension:
  - .mp4

# Video = every extension recognized as a movie file.
video_extensions:
  - .mp4
  - .mkv
  - .avi
  - .m4v
  - .mov
  - .wmv
  - .ts
  - .m2ts
  - .webm

# Sidecar = silently allowed alongside movies (poster art, subtitles, NFOs).
sidecar_extensions:
  - .srt


# ── Year range ──────────────────────────────────────────────────────────────
# Files with a year outside this range get warn_suspicious_year.
# `max: current` resolves to the current calendar year at boot.
year_range:
  min: 1888
  max: current

# ── Quality buckets ─────────────────────────────────────────────────────────
# Only used when categories are organized by quality (shape A above).
# Defines what UHD / HD / SD mean dimensionally. Empty default = no
# dimension checks fire. Configure in movies.local.yaml.
quality_thresholds: []

# ── Minimum movie duration ──────────────────────────────────────────────────
# Runtime floor in minutes. A movie file at or below this fires
# warn_short_duration — the target is a truncated or failed encode. Set to 0
# to disable the check.
#
# Expect legitimate hits at 30: short films, animated TV specials and stand-up
# sets are genuinely this short. Silence those per-path in
# ignored/<drive>/movies.yaml with `types: [warn_short_duration]` rather than
# lowering the threshold and losing the truncated-encode signal.
min_duration_minutes: 30

# ── TMDB runtime tolerance ──────────────────────────────────────────────────
# How far a file's runtime may differ from TMDB's, as a percentage of TMDB's,
# before warn_tmdb_runtime_mismatch fires. Symmetric: 50 flags anything under
# half or over one-and-a-half times TMDB's runtime. Set to 0 to disable.
#
# This is the precise version of min_duration_minutes — a real 2-minute short
# matches TMDB's 2 minutes and stays quiet, while a feature truncated to 5
# minutes is caught regardless of length. Runs in the validate pass, so it
# needs a TMDB match. Extended cuts TMDB doesn't carry will fire here.
runtime_tolerance_percent: 50

# ── Acceptable cross-quality combos ─────────────────────────────────────────
# Only used when categories are organized by quality (shape A above).
# Lists quality sets a single movie may legitimately span without firing
# warn_multi_quality. Default mirrors the common UHD master + HD downscale.
#
# These describe which quality TIERS may coexist, never how many copies may
# sit inside one tier — so a combo can't silence warn_duplicate_quality. A
# movie in UHD/ + HD/ + Other HD/ still resolves to the tier set {UHD, HD}
# and matches [UHD, HD], but the two HD-tier copies are reported regardless.
acceptable_quality_combos:
  - [UHD, HD]

# ── Per-warning toggles ─────────────────────────────────────────────────────
# Set any to false to silence that warning everywhere. To silence on specific
# paths only, use ignored/movies.yaml instead.
checks:
  warn_non_primary: true          # File isn't the configured primary format
  warn_no_videos: true            # Movie folder has no video files
  warn_bad_file_name: true        # File name doesn't match patterns.file
  warn_bad_folder_name: true      # Folder name doesn't match patterns.folder
  warn_empty_edition: true        # {edition-} with no value
  warn_suspicious_year: true      # Year outside year_range
  warn_title_mismatch: true       # File title vs folder title
  warn_title_case: true           # File title matches folder except for capitalization
  warn_year_mismatch: true        # File year vs folder year
  warn_duplicate_edition: true    # Two files in same folder claim same edition
  warn_duplicate_quality: true    # Movie in two folders of the SAME quality tier (HD + Other HD) — not whitelistable
  warn_multi_quality: true        # Movie in multiple quality folders (unless in acceptable_quality_combos)
  warn_quality_mismatch: true     # File dimensions don't fit its category's quality bucket
  warn_short_duration: false      # Runtime at or below min_duration_minutes
  warn_loose_files: true          # Video files at unexpected nesting
  warn_extra_subfolders: true     # Unexpected subfolders inside a movie folder
  warn_unexpected_entries: true   # Non-video, non-sidecar files
  warn_tmdb_no_match: true        # TMDB found no plausible match
  warn_tmdb_low_confidence: true  # TMDB match score below threshold
  warn_tmdb_year_mismatch: true   # TMDB canonical year differs from folder year
  warn_tmdb_title_canonical: true # Folder title differs from TMDB filename-safe canonical
  warn_tmdb_runtime_mismatch: true # Runtime differs from TMDB's by more than runtime_tolerance_percent
